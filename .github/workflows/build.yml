name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WUNDER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the WUNDER_KEYSTORE_BASE64 secret (see README) so every build is signed with the same key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          WUNDER_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          WUNDER_KEYSTORE_PASSWORD: ${{ secrets.WUNDER_KEYSTORE_PASSWORD }}
          WUNDER_KEY_ALIAS: wunder
          WUNDER_KEY_PASSWORD: ${{ secrets.WUNDER_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        id: apk
        run: |
          name="wunder-1.0.${{ github.run_number }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Wunder 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
          files: ${{ steps.apk.outputs.name }}
          make_latest: ${{ github.ref_name == github.event.repository.default_branch }}
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
